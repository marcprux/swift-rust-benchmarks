name: benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: "Measured runs per language per benchmark"
        default: "5"
        required: false

env:
  SWIFT_VERSION: "6.4"

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Install latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Toolchain versions
        shell: bash
        run: |
          swift --version
          rustc --version
          cargo --version
          python3 --version

      # The exact same entry point a developer runs locally. The harness appends
      # its Markdown tables to $GITHUB_STEP_SUMMARY automatically.
      - name: Run all benchmarks
        shell: bash
        run: python3 run-all.py --runs "${{ github.event.inputs.runs || 5 }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: results/
          if-no-files-found: warn

  # One page from every machine's results. This runs even when a matrix leg
  # failed, so the report covers whichever machines finished.
  report:
    name: report
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: Render the report
        run: |
          ls -l results
          python3 tools/report.py results --site site

      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: site/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/

  # Publish the page from the main branch. Pages must be set to deploy from
  # GitHub Actions in the repository settings.
  deploy:
    name: deploy to GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
